<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alerta Temprana de Rescate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
--ink:#1C1B2E; --paper:#FBFAF7; --card:#FFFFFF; --surface:#EFEDE8; --line:#DFDCD4; --muted:#6A6778;
--accent:#3B3A8C; --onaccent:#FFFFFF;
--u0:#B3261E; --u1:#B4530C; --u2:#7E630D; --u3:#2F6B4F;
--display:'Space Grotesk',Arial,sans-serif; --text:'Inter',Verdana,sans-serif;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
--ink:#F1F0F6; --paper:#131221; --card:#1C1B2E; --surface:#252338; --line:#343149; --muted:#9C98B4;
--accent:#9D9BF0; --onaccent:#131221;
--u0:#FF8A80; --u1:#FFB05C; --u2:#E6CB64; --u3:#73D5A6; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;
padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
padding-block:20px 128px}
h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.quien{background:var(--surface);border:none;border-radius:999px;padding:7px 14px;margin-bottom:14px;
font:inherit;font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lote{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
font:inherit;color:inherit;cursor:pointer}
.lote .nom{font-weight:600;font-size:17px;grid-column:1}
.lote .meta{color:var(--muted);font-size:14px;grid-column:1;font-variant-numeric:tabular-nums}
.tag{grid-column:2;grid-row:1 / span 2;justify-self:end;font-family:var(--display);font-size:13px;font-weight:600;
padding:6px 11px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.u0{color:var(--u0)}.u1{color:var(--u1)}.u2{color:var(--u2)}.u3{color:var(--u3)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.barin{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:none;font:inherit;font-family:var(--display);font-size:12px;font-weight:600;
color:var(--muted);padding:9px 2px 7px;cursor:pointer;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .dot{width:22px;height:3px;border-radius:2px;background:transparent}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"] .dot{background:var(--accent)}
.f{display:block;margin-bottom:18px}
.f > span.q{display:block;font-weight:500;margin-bottom:7px;font-size:15px}
input,select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:13px}
.btn{font-family:var(--display);font-size:16px;font-weight:600;border:none;border-radius:12px;padding:15px 20px;
cursor:pointer;background:var(--accent);color:var(--onaccent);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;width:auto}
.btn[disabled]{opacity:.45;cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.note{font-size:14px;color:var(--muted);margin:0 0 14px}
.note.good{color:var(--u3)}
.note.bad{color:var(--u0)}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;margin-bottom:12px;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:10px;
box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
.opt{width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:13px;
padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--card)}
.opt .t{font-family:var(--display);font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt .d{color:var(--muted);font-size:14px;margin-top:3px}
.sug{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.empty{text-align:center;padding:40px 14px;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);color:var(--ink);font-size:17px;margin-bottom:6px}
.hist{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.hist .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-size:15px;z-index:9;max-width:90vw}
.entrada{padding-top:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="barra" hidden><div class="barin" id="tabs"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var TABS=[["hoy","Hoy"],["registrar","Registrar"],["stock","Stock"],["historial","Historial"]];
var CARGOS=["Dueño o dueña","Encargado o encargada","Vendedor o vendedora","Otro"];
var DESTINOS={
 reubicar:["Reubicar","Llevarlo al mesón o al frente de la repisa, donde más se ve. Lo que vence primero sale primero."],
 descuento:["Descuento","Rebajarlo y marcarlo para que salga antes de la fecha."],
 donacion:["Donación","Entregarlo hoy mientras todavía está apto para consumo."],
 retirar:["Retirar","Sacarlo de la venta: ya pasó su fecha."]
};
var vista="hoy", sel=null, elegido=null, editando=false, mover=null, sesion=null, lotes=[], productos={}, lector=null;
var app=document.getElementById("app"), tabsEl=document.getElementById("tabs"), barra=document.getElementById("barra");

function L(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function S(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
sesion=L("atr_sesion",null); lotes=L("atr_lotes",[]); productos=L("atr_productos",{});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function p2(n){return (n<10?"0":"")+n}
function hoyISO(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function dias(v){if(!v)return null;var a=new Date(v+"T00:00:00"),b=new Date(hoyISO()+"T00:00:00");if(isNaN(a))return null;return Math.round((a-b)/86400000)}
function etiqueta(d){
  if(d==null)return {txt:"Sin fecha",cls:"u2"};
  if(d<0)return {txt:"Vencido",cls:"u0"};
  if(d===0)return {txt:"Vence hoy",cls:"u0"};
  if(d===1)return {txt:"Mañana",cls:"u1"};
  if(d<=3)return {txt:"En "+d+" días",cls:"u2"};
  return {txt:"En "+d+" días",cls:"u3"};
}
function sugerido(d){if(d==null)return "descuento";if(d<0)return "retirar";if(d===0)return "donacion";if(d<=2)return "descuento";return "reubicar"}
function activos(){return lotes.filter(function(l){return l.estado!=="resuelto"})}
function guardar(){S("atr_lotes",lotes);S("atr_productos",productos)}

function pintarTabs(){
  tabsEl.innerHTML=TABS.map(function(t){
    return '<button class="tab" type="button" data-v="'+t[0]+'" aria-current="'+(vista===t[0])+'"><span class="dot"></span>'+t[1]+'</button>';
  }).join("");
  Array.prototype.forEach.call(tabsEl.children,function(b){b.onclick=function(){pararCamara();sel=null;editando=false;vista=b.getAttribute("data-v");pintar();window.scrollTo(0,0)}});
}
function chip(){return sesion?'<button class="quien" type="button" id="quien">'+esc(sesion.nombre)+' · '+esc(sesion.cargo)+'</button>':""}

function pintar(){
  barra.hidden=!sesion;
  if(!sesion){app.innerHTML=htmlEntrada();conectarEntrada();return}
  pintarTabs();
  if(sel&&editando){app.innerHTML=htmlEditar();conectarEditar();return}
  if(sel){app.innerHTML=htmlDetalle();conectarDetalle();return}
  if(vista==="hoy")app.innerHTML=chip()+htmlHoy();
  else if(vista==="registrar"){app.innerHTML=chip()+htmlRegistrar();conectarRegistrar()}
  else if(vista==="stock")app.innerHTML=chip()+htmlStock();
  else app.innerHTML=chip()+htmlHistorial();
  var q=document.getElementById("quien");
  if(q)q.onclick=function(){pararCamara();sesion=null;S("atr_sesion",null);sel=null;pintar()};
  if(vista==="hoy"||vista==="stock")conectarLotes();
  if(vista==="historial")conectarHistorial();
}

function htmlEntrada(){
  var ops=CARGOS.map(function(c){return '<option>'+esc(c)+'</option>'}).join("");
  return '<div class="entrada"><h1>Alerta Temprana de Rescate</h1>'+
   '<p class="sub">Antes de empezar, dinos quién va a usar la app. Queda registrado en cada decisión.</p>'+
   '<label class="f"><span class="q">Nombre</span><input type="text" id="enombre" autocomplete="off"></label>'+
   '<label class="f"><span class="q">Cargo</span><select id="ecargo"><option value="">Elige tu cargo</option>'+ops+'</select></label>'+
   '<button class="btn" type="button" id="entrar">Entrar</button>'+
   '<p class="note" id="entmsg" style="margin-top:12px"></p></div>';
}
function conectarEntrada(){
  document.getElementById("entrar").onclick=function(){
    var n=document.getElementById("enombre").value.trim(),c=document.getElementById("ecargo").value,m=document.getElementById("entmsg");
    if(!n){m.textContent="Falta tu nombre.";m.className="note bad";return}
    if(!c){m.textContent="Falta elegir el cargo.";m.className="note bad";return}
    sesion={nombre:n,cargo:c};S("atr_sesion",sesion);vista="hoy";pintar();
  };
}

function tarjeta(l){
  var d=dias(l.vence),e=etiqueta(d);
  return '<button class="lote" type="button" data-id="'+esc(l.id)+'">'+
    '<span class="nom">'+esc(l.nombre||"Sin nombre")+'</span>'+
    '<span class="meta">'+esc(l.cantidad||0)+' u · vence '+esc(l.vence||"—")+'</span>'+
    '<span class="tag '+e.cls+'">'+e.txt+'</span></button>';
}
function conectarLotes(){
  Array.prototype.forEach.call(app.querySelectorAll(".lote"),function(b){
    b.onclick=function(){
      sel=lotes.filter(function(l){return l.id===b.getAttribute("data-id")})[0]||null;
      elegido=sel?sugerido(dias(sel.vence)):null;mover=null;pintar();window.scrollTo(0,0);
    };
  });
}
function htmlHoy(){
  var list=activos().filter(function(l){var d=dias(l.vence);return d==null||d<=3})
    .sort(function(a,b){return (dias(a.vence)==null?99:dias(a.vence))-(dias(b.vence)==null?99:dias(b.vence))});
  var h='<div class="top"><h1>Alertas del turno</h1><span class="count">'+hoyISO()+'</span></div>'+
        '<p class="sub">Lotes que vencen en 3 días o menos. Toca uno para decidir qué hacer.</p>';
  if(!list.length)return h+'<div class="empty"><strong>Nada urgente por ahora</strong>Registra productos con su fecha y los que estén por vencer aparecen acá.</div>';
  return h+list.map(tarjeta).join("");
}
function htmlDetalle(){
  var l=sel,d=dias(l.vence),e=etiqueta(d),sug=sugerido(d);
  var h='<div class="top"><button class="btn ghost small" type="button" id="volver">Volver</button>'+
   '<button class="btn ghost small" type="button" id="editar">Editar lote</button></div>'+
   '<div class="sheet" style="margin-top:14px"><h2>'+esc(l.nombre||"Sin nombre")+'</h2>'+
   '<p class="note">'+esc(l.cantidad||0)+' unidades · vence '+esc(l.vence||"—")+' · <span class="'+e.cls+'" style="font-weight:600">'+e.txt+'</span></p></div>'+
   '<h2 style="margin-bottom:10px">¿Qué hacemos con este lote?</h2>';
  ["reubicar","descuento","donacion","retirar"].forEach(function(k){
    var dd=DESTINOS[k];
    h+='<button class="opt" type="button" data-k="'+k+'" aria-pressed="'+(elegido===k)+'">'+
      '<span class="t">'+esc(dd[0])+(k===sug?'<span class="sug">Sugerido</span>':'')+'</span>'+
      '<span class="d">'+esc(dd[1])+'</span></button>';
  });
  var tot=Number(l.cantidad)||0;
  if(tot>0)h+='<label class="f" style="margin-top:8px"><span class="q">¿Cuántas unidades mueves? (de '+tot+')</span>'+
    '<div style="display:flex;gap:10px"><input type="number" id="mover" min="1" max="'+tot+'" step="1" inputmode="numeric" value="'+esc(mover==null?tot:mover)+'">'+
    '<button class="btn ghost small" type="button" id="todo" style="flex:none">Todas</button></div></label>'+
    '<p class="note">Si mueves menos que el total, el resto sigue en el stock con la misma fecha.</p>';
  return h+'<p class="note">Todas las opciones respetan el límite sanitario: ninguna extiende la fecha de vencimiento.</p>'+
    '<button class="btn" type="button" id="confirmar">Confirmar decisión</button>'+
    '<p class="note bad" id="detmsg" style="margin-top:12px"></p>';
}
function conectarDetalle(){
  document.getElementById("volver").onclick=function(){sel=null;pintar()};
  document.getElementById("editar").onclick=function(){editando=true;pintar();window.scrollTo(0,0)};
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){elegido=b.getAttribute("data-k");pintar()}});
  var mi=document.getElementById("mover");
  if(mi){
    mi.oninput=function(){mover=this.value};
    document.getElementById("todo").onclick=function(){mover=null;mi.value=Number(sel.cantidad)||0};
  }
  document.getElementById("confirmar").onclick=function(){
    var l=lotes.filter(function(x){return x.id===sel.id})[0];if(!l)return;
    var tot=Number(l.cantidad)||0,n=mi?Number(mi.value):tot;
    if(tot>0&&(!(n>=1)||n>tot||Math.floor(n)!==n)){
      document.getElementById("detmsg").textContent="Indica un número entero entre 1 y "+tot+".";return}
    var ahora=Date.now();
    if(tot>0&&n<tot){
      l.cantidad=tot-n;
      lotes.push({id:String(ahora)+"-"+Math.random().toString(36).slice(2,6),codigo:l.codigo,nombre:l.nombre,
        cantidad:n,vence:l.vence,ts:l.ts,por:l.por,cargo:l.cargo,origen:l.id,
        estado:"resuelto",destino:elegido,resueltoTs:ahora,resueltoPor:sesion.nombre});
      toast(DESTINOS[elegido][0]+": "+n+" u · quedan "+(tot-n));
    }else{
      l.estado="resuelto";l.destino=elegido;l.resueltoTs=ahora;l.resueltoPor=sesion.nombre;
      toast(DESTINOS[elegido][0]+" confirmado");
    }
    guardar();sel=null;mover=null;vista="hoy";pintar();
  };
}

function htmlEditar(){
  var l=sel;
  return '<button class="btn ghost small" type="button" id="cancelar">Cancelar</button>'+
   '<h1 style="margin:14px 0 4px">Editar lote</h1>'+
   '<p class="sub">Corrige lo que quedó mal registrado. El cambio queda a tu nombre.</p>'+
   '<label class="f"><span class="q">Nombre del producto</span><input type="text" id="enom" autocomplete="off" value="'+esc(l.nombre)+'"></label>'+
   '<label class="f"><span class="q">Código del producto</span><input type="text" id="ecod" autocomplete="off" placeholder="Opcional" value="'+esc(l.codigo)+'"></label>'+
   '<div class="pair">'+
   '<label class="f"><span class="q">Cuántos tienes</span><input type="number" id="ecant" min="0" step="1" inputmode="numeric" value="'+esc(l.cantidad||0)+'"></label>'+
   '<label class="f"><span class="q">Vence el</span><input type="date" id="evence" value="'+esc(l.vence)+'"></label></div>'+
   '<button class="btn" type="button" id="guardaredit">Guardar cambios</button>'+
   '<p class="note" id="editmsg" style="margin-top:12px"></p>'+
   '<button class="btn ghost" type="button" id="eliminar" style="margin-top:8px;color:var(--u0)">Eliminar lote</button>';
}
function conectarEditar(){
  document.getElementById("cancelar").onclick=function(){editando=false;pintar()};
  document.getElementById("guardaredit").onclick=function(){
    var msg=document.getElementById("editmsg");
    var nombre=document.getElementById("enom").value.trim();
    var codigo=document.getElementById("ecod").value.trim();
    var cantidad=Number(document.getElementById("ecant").value)||0;
    var vence=document.getElementById("evence").value;
    if(!nombre){msg.textContent="Falta el nombre del producto.";msg.className="note bad";return}
    if(!vence){msg.textContent="Falta la fecha de vencimiento.";msg.className="note bad";return}
    sel.nombre=nombre;sel.codigo=codigo;sel.cantidad=cantidad;sel.vence=vence;
    sel.editadoTs=Date.now();sel.editadoPor=sesion.nombre;
    if(codigo)productos[codigo]=nombre;
    guardar();toast("Cambios guardados");editando=false;pintar();
  };
  var del=document.getElementById("eliminar"),armado=false;
  del.onclick=function(){
    if(!armado){armado=true;del.textContent="Toca otra vez para eliminar";return}
    var id=sel.id,nom=sel.nombre;
    lotes=lotes.filter(function(x){return x.id!==id});
    guardar();toast((nom||"Lote")+" eliminado");sel=null;editando=false;pintar();window.scrollTo(0,0);
  };
}

function htmlRegistrar(){
  var ops=Object.keys(productos).map(function(c){return '<option value="'+esc(productos[c])+'">'}).join("");
  return '<h1>Registrar stock</h1>'+
   '<p class="sub">Apunta la cámara al código de barras: se lee solo, sin tomar foto.</p>'+
   '<div id="camwrap"></div>'+
   '<button class="btn" type="button" id="abrir">Abrir cámara</button>'+
   '<p class="note" id="scanmsg" style="margin-top:12px"></p>'+
   '<label class="f"><span class="q">Código del producto</span><input type="text" id="codigo" autocomplete="off" placeholder="Opcional"></label>'+
   '<label class="f"><span class="q">Nombre del producto</span><input type="text" id="nombre" list="conocidos" autocomplete="off"></label>'+
   '<datalist id="conocidos">'+ops+'</datalist>'+
   '<div class="pair">'+
   '<label class="f"><span class="q">Cuántos tienes</span><input type="number" id="cantidad" min="1" step="1" inputmode="numeric" value="1"></label>'+
   '<label class="f"><span class="q">Vence el</span><input type="date" id="vence" value="'+hoyISO()+'"></label></div>'+
   '<button class="btn" type="button" id="guardarlote">Guardar en el stock</button>'+
   '<p class="note" id="regmsg" style="margin-top:12px"></p>';
}
function conectarRegistrar(){
  document.getElementById("abrir").onclick=abrirCamara;
  document.getElementById("codigo").oninput=function(){
    var c=this.value.trim(),n=document.getElementById("nombre");
    if(productos[c]&&!n.value)n.value=productos[c];
  };
  document.getElementById("guardarlote").onclick=guardarLote;
}
function abrirCamara(){
  var msg=document.getElementById("scanmsg"),wrap=document.getElementById("camwrap"),btn=document.getElementById("abrir");
  if(typeof ZXing==="undefined"){msg.textContent="No se pudo cargar el lector. Escribe el código a mano.";msg.className="note bad";return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent="Este navegador no da acceso a la cámara. Debe abrirse por https.";msg.className="note bad";return}
  wrap.innerHTML='<div class="scanbox"><video id="video" playsinline muted></video><div class="mira"></div></div>';
  btn.textContent="Cerrar cámara";btn.onclick=function(){pararCamara();pintar()};
  msg.textContent="Buscando un código…";msg.className="note";
  var hints=new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
    ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.QR_CODE]);
  lector=new ZXing.BrowserMultiFormatReader(hints,300);
  lector.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},"video",function(res){
    if(res)alCodigo(res.getText());
  }).catch(function(e){
    msg.textContent="No se pudo abrir la cámara: "+(e&&e.name||"error")+". Escribe el código a mano.";msg.className="note bad";
  });
}
function pararCamara(){if(lector){try{lector.reset()}catch(e){}lector=null}}
function alCodigo(code){
  var ci=document.getElementById("codigo");if(!ci)return;
  if(ci.value===code)return;
  ci.value=code;
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  pararCamara();
  var wrap=document.getElementById("camwrap");if(wrap)wrap.innerHTML="";
  var btn=document.getElementById("abrir");if(btn){btn.textContent="Abrir cámara";btn.onclick=abrirCamara}
  var msg=document.getElementById("scanmsg"),ni=document.getElementById("nombre");
  if(productos[code]){ni.value=productos[code];msg.textContent="Reconocido: "+productos[code];msg.className="note good";return}
  msg.textContent="Código "+code+" leído. Buscando el nombre…";msg.className="note";
  buscarNombre(code).then(function(nom){
    if(nom){ni.value=nom;msg.textContent="Encontrado: "+nom;msg.className="note good"}
    else{msg.textContent="Código "+code+" leído. No está en la base pública: escribe el nombre y queda guardado.";msg.className="note"}
  });
}
function buscarNombre(code){
  var url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+
          ".json?fields=product_name,product_name_es,generic_name,brands,quantity";
  return fetch(url).then(function(r){return r.json()}).then(function(j){
    if(!j||j.status!==1||!j.product)return null;
    var p=j.product;
    var partes=[p.brands?String(p.brands).split(",")[0].trim():"", p.product_name_es||p.product_name||p.generic_name||"", p.quantity||""];
    var nom=partes.filter(function(x){return x}).join(" ").trim();
    return nom||null;
  }).catch(function(){return null});
}
function guardarLote(){
  var msg=document.getElementById("regmsg");
  var nombre=document.getElementById("nombre").value.trim();
  var codigo=document.getElementById("codigo").value.trim();
  var cantidad=Number(document.getElementById("cantidad").value)||0;
  var vence=document.getElementById("vence").value;
  if(!nombre){msg.textContent="Falta el nombre del producto.";msg.className="note bad";return}
  if(!vence){msg.textContent="Falta la fecha de vencimiento.";msg.className="note bad";return}
  pararCamara();
  lotes.push({id:String(Date.now())+"-"+Math.random().toString(36).slice(2,6),codigo:codigo,nombre:nombre,
    cantidad:cantidad,vence:vence,ts:Date.now(),estado:"activo",por:sesion.nombre,cargo:sesion.cargo});
  if(codigo)productos[codigo]=nombre;
  guardar();toast(nombre+" guardado");vista="stock";pintar();window.scrollTo(0,0);
}

function htmlStock(){
  var list=activos().slice().sort(function(a,b){var x=dias(a.vence),y=dias(b.vence);return (x==null?999:x)-(y==null?999:y)});
  var h='<div class="top"><h1>Stock registrado</h1><span class="count">'+list.length+' lote'+(list.length===1?"":"s")+'</span></div>'+
        '<p class="sub">Todo lo cargado, del más próximo a vencer al más lejano. Toca un lote para decidir o editarlo.</p>';
  if(!list.length)return h+'<div class="empty"><strong>El stock está vacío</strong>Registra un producto con su fecha para empezar.</div>';
  return h+list.map(tarjeta).join("");
}
function htmlHistorial(){
  var list=lotes.filter(function(l){return l.estado==="resuelto"}).sort(function(a,b){return (b.resueltoTs||0)-(a.resueltoTs||0)});
  var h='<h1>Historial</h1><p class="sub">Lo que se decidió, con su hora y quién lo hizo. Si algo quedó mal marcado, tócale Deshacer y vuelve al stock.</p>';
  if(!list.length)return h+'<div class="empty"><strong>Todavía no hay decisiones</strong>Cuando confirmes el destino de un lote, queda registrado acá.</div>';
  return h+list.map(function(l){
    var dd=DESTINOS[l.destino]||["—",""],f="";
    try{f=new Date(l.resueltoTs).toLocaleString("es-CL",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){}
    return '<div class="hist"><span><b>'+esc(l.nombre)+'</b><br><span class="d">'+esc(dd[0])+' · '+esc(l.cantidad||0)+' u'+(l.resueltoPor?' · '+esc(l.resueltoPor):'')+'</span></span>'+
      '<span style="text-align:right"><span class="d">'+esc(f)+'</span><br>'+
      '<button class="btn ghost small" type="button" data-deshacer="'+esc(l.id)+'" style="margin-top:6px;padding:6px 12px">Deshacer</button></span></div>';
  }).join("");
}
function conectarHistorial(){
  Array.prototype.forEach.call(app.querySelectorAll("[data-deshacer]"),function(b){
    b.onclick=function(){deshacer(b.getAttribute("data-deshacer"))};
  });
}
function deshacer(id){
  var r=lotes.filter(function(x){return x.id===id})[0];if(!r)return;
  var o=r.origen?lotes.filter(function(x){return x.id===r.origen&&x.estado!=="resuelto"})[0]:null;
  if(o){
    o.cantidad=(Number(o.cantidad)||0)+(Number(r.cantidad)||0);
    lotes=lotes.filter(function(x){return x.id!==id});
  }else{
    r.estado="activo";delete r.destino;delete r.resueltoTs;delete r.resueltoPor;delete r.origen;
  }
  guardar();toast((r.nombre||"Lote")+" vuelve al stock");pintar();
}

var tEl=null;
function toast(t){
  if(tEl)tEl.remove();
  tEl=document.createElement("div");tEl.className="toast";tEl.textContent=t;document.body.appendChild(tEl);
  setTimeout(function(){if(tEl){tEl.remove();tEl=null}},2600);
}
window.addEventListener("pagehide",pararCamara);
pintar();
</script>
</body>
</html>
